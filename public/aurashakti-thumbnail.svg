<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0505" />
      <stop offset="100%" stop-color="#050000" />
    </radialGradient>
    
    <!-- Metallic Red Gradients -->
    <linearGradient id="red-metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="50%" stop-color="#660000" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>

    <linearGradient id="red-metal-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="30%" stop-color="#cc0000" />
      <stop offset="70%" stop-color="#800000" />
      <stop offset="100%" stop-color="#ff4d4d" />
    </linearGradient>
    
    <linearGradient id="red-metal-swoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="50%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#ff4d4d" />
    </linearGradient>

    <!-- Drop Shadow for 3D effect -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Inner Shadow / Bevel effect -->
    <filter id="bevel">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="-2" dy="-2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="arithmetic" k2="1" k3="-1" result="shadowDiff"/>
      <feFlood flood-color="#ffb3b3" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)"/>
  
  <!-- Top Left Swoosh -->
  <path d="M 0 0 L 350 0 C 150 150, 50 350, 0 550 Z" fill="url(#red-metal-dark)" opacity="0.7" filter="url(#drop-shadow)"/>
  <path d="M 0 0 L 300 0 C 100 150, 20 350, 0 500 Z" fill="url(#red-metal-light)" opacity="0.4"/>
  
  <!-- Bottom Right Swoosh -->
  <path d="M 800 800 L 450 800 C 650 650, 750 450, 800 250 Z" fill="url(#red-metal-dark)" opacity="0.7" filter="url(#drop-shadow)"/>
  <path d="M 800 800 L 500 800 C 700 650, 780 450, 800 300 Z" fill="url(#red-metal-light)" opacity="0.4"/>
  
  <!-- The 'A' Logo -->
  <g transform="translate(400, 340)" filter="url(#drop-shadow)">
    <!-- Left Leg -->
    <path d="M 0 -220 L -200 220 L -140 220 L 0 -100 Z" fill="url(#red-metal-light)" filter="url(#bevel)"/>
    <!-- Right Leg -->
    <path d="M 0 -220 L 0 -100 L 140 220 L 200 220 Z" fill="url(#red-metal-dark)" filter="url(#bevel)"/>
    
    <!-- The Swoosh (Crossbar) -->
    <path d="M -160 80 C -50 40, 50 -20, 280 -100 C 150 -20, 50 60, -130 110 Z" fill="url(#red-metal-swoosh)" filter="url(#bevel)"/>
  </g>
  
  <!-- AURA Text -->
  <text x="420" y="680" font-family="'Trebuchet MS', Arial, sans-serif" font-size="65" font-weight="normal" letter-spacing="45" fill="url(#red-metal-light)" text-anchor="middle" filter="url(#drop-shadow)">AURA</text>
</svg>
